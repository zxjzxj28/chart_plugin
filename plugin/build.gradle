plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
}

// Plugin version configuration (self-contained for composite builds)
def agpVersion = '8.1.0'
def gsonVersion = '2.10.1'
def okhttpVersion = '4.11.0'

group = 'com.yourcompany.a11y'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation gradleApi()
    implementation "com.android.tools.build:gradle:${agpVersion}"
    implementation "com.google.code.gson:gson:${gsonVersion}"
    implementation "com.squareup.okhttp3:okhttp:${okhttpVersion}"

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.11.0'
}

gradlePlugin {
    plugins {
        chartA11yPlugin {
            id = 'com.yourcompany.chart-a11y'
            implementationClass = 'com.yourcompany.a11y.ChartA11yPlugin'
            displayName = 'Chart Accessibility Plugin'
            description = 'Gradle plugin for generating chart accessibility descriptions'
        }
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'chart-a11y-plugin'
            version = project.version
            from components.java
        }
    }
    repositories {
        maven {
            name = 'local'
            url = "${project.buildDir}/repo"
        }
    }
}
