buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.squareup.okhttp3:okhttp:4.12.0'
    }
}

plugins {
    id 'com.android.application'
    id 'com.yourcompany.chart-a11y'
}

// Expected response: JSON object like {"a11y_chart_sales_quarterly_brief":"..."}
def chartDescriptionsUrl = project.findProperty('chartDescriptionsUrl') ?: 'https://example.com/chart-descriptions'

android {
    namespace 'com.yourcompany.a11y.sample'
    compileSdk 34

    defaultConfig {
        applicationId "com.yourcompany.a11y.sample"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            res.srcDirs += "${buildDir}/generated/res/chartDescriptions"
        }
    }
}

tasks.register('fetchChartDescriptions') {
    def outputDir = file("${buildDir}/generated/res/chartDescriptions/values")
    outputs.dir(outputDir)

    doLast {
        if (!chartDescriptionsUrl?.trim()) {
            throw new GradleException('chartDescriptionsUrl is empty. Please configure the remote endpoint URL.')
        }

        outputDir.mkdirs()
        def outputFile = new File(outputDir, 'strings.xml')
        def client = new okhttp3.OkHttpClient()
        def request = new okhttp3.Request.Builder()
                .url(chartDescriptionsUrl)
                .build()
        def response = client.newCall(request).execute()
        try {
            if (!response.isSuccessful()) {
                throw new GradleException("Failed to fetch chart descriptions: HTTP ${response.code()}")
            }

            def payload = response.body().string()
            def parsed = new groovy.json.JsonSlurper().parseText(payload)

            def writer = new StringWriter()
            def xml = new groovy.xml.MarkupBuilder(writer)
            xml.resources {
                parsed.each { key, value ->
                    string(name: key, value.toString())
                }
            }

            outputFile.text = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n${writer}"
        } finally {
            response.close()
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(tasks.named('fetchChartDescriptions'))
}

// Configure Chart A11y Plugin
chartA11y {
    configFile 'src/main/assets/chart_configs.json'
    apiEndpoint = 'https://api.example.com/a11y'
    apiKey = System.getenv('CHART_A11Y_API_KEY') ?: ''
    locales 'zh-CN', 'en'
    processLayouts = true
    enableCache = true
    cacheDir = file("${buildDir}/chart-a11y-cache")
    timeout = 30L
    concurrency = 4
    failOnError = false
}

dependencies {
    implementation project(':runtime')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // MPAndroidChart for demo charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
