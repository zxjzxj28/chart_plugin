// Top-level build file for Chart Accessibility Plugin
buildscript {
    ext {
        agpVersion = '8.1.0'
        kotlinVersion = '1.9.0'
        gsonVersion = '2.10.1'
        okhttpVersion = '4.11.0'
        androidxCoreVersion = '1.12.0'
        androidxAnnotationVersion = '1.7.0'
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:${agpVersion}"
    }
}

allprojects {
    group = 'com.yourcompany.a11y'
    version = '1.0.0'
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
