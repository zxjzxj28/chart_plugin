pluginManagement {
    // Include plugin module for composite build (allows development without publishing)
    includeBuild('plugin')

    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // For MPAndroidChart
        maven { url = uri("https://jitpack.io") }
    }
}

rootProject.name = 'chart-a11y'

include ':plugin'
include ':runtime'
include ':sample'
