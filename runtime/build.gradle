plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.yourcompany.a11y.runtime'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    implementation "androidx.core:core:${rootProject.ext.androidxCoreVersion}"
    implementation "androidx.annotation:annotation:${rootProject.ext.androidxAnnotationVersion}"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.group
                artifactId = 'chart-a11y-runtime'
                version = project.version
            }
        }
        repositories {
            maven {
                name = 'local'
                url = "${rootProject.buildDir}/repo"
            }
        }
    }
}
